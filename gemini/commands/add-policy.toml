description = "Add (or audit) a Policy for an Eloquent model — generate the Policy class, wire it, and patch all controllers/Livewire components/routes to use it.  (args: <ModelName> [--adaptive])"

prompt = '''
# Add Policy — `{{args}}`

> **Delegation:** Spawn each specialist by its registered agent type as it appears in your available-agents list — prefixed when installed as a plugin (e.g. `laravel-team:backend-developer`), unprefixed when installed via `install.sh`. The specialist names in this command are labels, not literal `subagent_type` strings.

> **Interface:** Print a progress board after the plan and after every stage — `✔ done / ▶ running / · queued / ✖ failed` + owner + one-line result, so the user never wonders what's running or what's left. The board's header states the stage budget **before** any agent spends tokens — how many stages you expect and the observable condition that ends the run (`N stages · done when: <the observable thing>`); a board that arrives only as a closing summary told the human nothing they could still act on. Growing past that budget is a re-plan: reprint the header with the new count and why it grew. Demand each specialist return `STATUS / DID / VERIFIED / NOT-CHECKED / FLAGS / NEXT` (≤12 lines; an empty VERIFIED is a claim, a missing NOT-CHECKED is uncalibrated — either → re-brief once naming the gap). **Stage returns land on disk** — brief each specialist with `docs/delivery/<name>/stages/<agent>.md`; writers Write the six fields there as their last act; Read that file before `✔`; never write a writer's stage file for them. Read-only specialists (`disallowedTools: Write`) — persist their stage file from the report you already file, same as their other artifacts. Human decision needed → numbered options with a recommended default, never a paragraph. **Your own final answer closes the same way** — a `VERIFIED` line carrying the commands you actually ran, then `NOT-CHECKED` naming what you did not verify (≤3 lines, or "none"). **Once ≥2 specialists have reported, this delivery harvests too** — persist `docs/team/stack.md` (verified project facts + where-things-live, `delivery-templates` skill shape) from what they've reported, and maintain `docs/delivery/<name>/log.md` (phase by phase, agent by agent, artifact by artifact). Both exist before your final answer, not after. A single-specialist ask has nothing to harvest — skip both. **You do not build and you do not patch** — Write/Edit only under `docs/**`; never edit a specialist's files to "just fix it" (re-brief or escalate). **Verify before advancing** — re-run that brief's success criteria yourself; a specialist's `STATUS: done` is a claim, not a `✔`. Stage returns are internal; this is the only calibration the human ever sees, so a run that ends without it is unfinished. **Brief only what the specialist owns** — goal, owned paths, success criteria, stage path, named stack facts; not another specialist's diff. **Join before a dependent stage** — Read every upstream stage file and re-run its criteria before starting a stage that depends on it. Re-brief overwrites `docs/delivery/<name>/stages/<agent>.md`. **Close file on disk** — after the plan and after every stage, overwrite `docs/delivery/<name>/close.md` with coordinator `VERIFIED` / `NOT-CHECKED` / `STATUS` / `BOARD`. A killed run is scored from that file. After that Write, print `VERIFIED:` / `NOT-CHECKED:` / `STATUS:` / `BOARD:` in the same turn. Before the first Agent, if `docs/delivery/<name>/close.md` exists: `STATUS: done` or `stopped` → print those four labels and stop; `STATUS: running` → reprint the board from disk, skip a writer whose `stages/<agent>.md` is `STATUS: done` and a path named in `DID:` or `VERIFIED:` still exists, skip a read-only stage file that is `STATUS: done`, Agent `▶` and `·`; remaining spawn cap is `M` minus distinct `stages/*.md` already present. **Spawn cap in the board header** — `N stages · cap: M spawns · done when:`; `M` defaults to `N+2`; hitting `M` without `done when:` → `close.md` `STATUS: stopped` and stop. When `--adaptive` is in the command arguments, a writer may Write a no-re-ask packet at `docs/delivery/<name>/packets/<from>-to-<peer>.md` naming a registered peer, or the coordinator Writes one fallback packet FROM that writer TO the next queued specialist else tech-lead — one fallback packet per run; spawn `peer-router` when a packet exists; after it returns, Write `docs/delivery/<name>/stages/peer-router.md`; print a handoff line `handoff: <from> → <to>` on the board; then Agent that peer with the packet as the brief; hops count against the spawn cap. Without `--adaptive`, ignore `packets/` and never spawn `peer-router`. After the plan, first Write of `docs/delivery/<name>/graph.md` is a byte copy of skills/delivery-templates/graph.md, then Edit only after the colons; do not spawn a type that is not a NODES: entry; an Adaptive hop TO: must be a node.

Add or audit the authorization Policy for the `{{args}}` Eloquent model, and ensure every code path that touches the model uses it.

## What you do

1. **Locate the model.** `app/Models/{{args}}.php` (or wherever the project keeps models per its convention). If it doesn't exist, stop and ask.

2. **Find all touch points.** Grep for:
   - `{{args}}::` (static calls — `find`, `findOrFail`, `where`, `create`)
   - `{{args}}\b` in controllers, Livewire components, Filament resources, jobs, and API Resources
   - Routes that bind `{{args}}` via route model binding (look for `{{args}}` lowercased in `routes/`)

3. **Delegate to `backend-developer`** to:
   - Generate `app/Policies/{{args}}Policy.php` via `php artisan make:policy {{args}}Policy --model={{args}}` if not already present
   - Implement `viewAny`, `view`, `create`, `update`, `delete`, `restore`, `forceDelete` with real rules (not stubs)
   - Register the Policy in `App\Providers\AuthServiceProvider::$policies` (or rely on auto-discovery if the project uses it)
   - Patch every touch point to invoke the Policy:
     - In controllers: `$this->authorize('view', $model)` or `Gate::authorize('view', $model)`
     - In Form Requests: implement `authorize()` to delegate to the Policy
     - In Livewire components: `$this->authorize('view', $this->model)` in mount/render
     - In Filament resources: implement the `can*` methods or rely on Filament's auto-detection
     - In API Resources: don't authorize in the Resource — that's the controller's job

4. **Delegate to `qa-engineer`** to write:
   - One "allowed" test and one "denied" test for each Policy method
   - Use `actingAs($user)` and `actingAs($otherUser)` to cover both sides

5. **Delegate to `security-engineer`** for a final review confirming:
   - No protected routes remain without an authorization check
   - The Policy rules match the business rules in `docs/requirements/`
   - Mass-assignment safety is intact on the model

## Output

- Path to the new Policy
- List of files patched
- Test results for the new Policy tests
- Any routes/components that the audit could not auto-patch and need human attention
'''
