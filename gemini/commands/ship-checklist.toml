description = "Run the pre-release ship checklist for a Laravel app — quality gates, migrations, queues, env, security, docs — and produce a go/no-go report.  (args: [version-tag] [--adaptive])"

prompt = '''
# Ship checklist — `{{args}}`

> **Delegation:** Spawn each specialist by its registered agent type as it appears in your available-agents list — prefixed when installed as a plugin (e.g. `laravel-team:backend-developer`), unprefixed when installed via `install.sh`. The specialist names in this command are labels, not literal `subagent_type` strings.

> **Interface:** Call `python3 scripts/guild-kernel/guild.py` for this delivery — `plan` before any Agent, `ready` to fetch the bounded dependency-ready wave, `claim --stage <id>` before each Agent, then dispatch every claimed lane concurrently, and `report` on `docs/delivery/<name>/stages/<agent>.md` after each return, `board` to print `✔ done / ▶ running / · queued / ✖ failed`. `plan` must pass a nonempty `--done-when` and every typed `--stage-json` must carry success criteria, `owned_paths`, and `approval_categories` (an empty array only when no profile category applies); use `--max-parallel` to set the WIP ceiling. After `plan`, call `approval list`; for every pending category ask the human with numbered options, and only the main thread may call `approval grant`. Unapproved lanes stay paused and are excluded from `ready`. If a sprint is running, attach it (`--sprint <id>` or the kernel attaches the single running sprint). Never invent a checkmark; never compose `docs/delivery/<name>/close.md` (the kernel renders that view). Never compose `docs/sprints/<id>/sprint.md` (the kernel renders that view). `plan` prints `RULES:` only for user-approved learned rules; brief every `RULES:` line. Never compose `docs/team/lessons.md` (the kernel renders that view). When the command includes `--issue <n>`, `plan` passes `--issue <n>`. Call `pr --number <n>` once a pull request exists; the kernel re-fetches it. Call `ingest` only for a failing check or a review comment the kernel confirms. Never compose issue or pr fields. A workplace delivery stays running until the recorded PR state is open. Never merge. Writers Write the six fields `STATUS / DID / VERIFIED / NOT-CHECKED / FLAGS / NEXT` (≤12 lines) as their last act; never write a writer's stage file for them. Read-only specialists — persist their stage file from the report you already file, then `report`. `VERIFIED:` lines are JSON verification records (`{"runner":"artisan-test","args":["--filter=TagTest"]}`); the kernel accepts only registered runners and executes argv without a shell; prose and legacy command strings are rejected. `NOT-CHECKED:` that names a stage success criterion is a reject. Human decision needed → numbered options with a recommended default, never a paragraph. **Your own final answer closes the same way** — a `VERIFIED` line carrying the commands you actually ran, then `NOT-CHECKED` naming what you did not verify (≤3 lines, or "none"). **Once ≥2 specialists have reported, this delivery harvests too** — persist `docs/team/stack.md` (verified project facts + where-things-live, `delivery-templates` skill shape) from what they've reported, and maintain `docs/delivery/<name>/log.md` (phase by phase, agent by agent, artifact by artifact). Both exist before your final answer, not after. A single-specialist ask has nothing to harvest — skip both. **You do not build and you do not patch** — Write/Edit only under `docs/**`; never edit a specialist's files to "just fix it" (re-brief or escalate). When `--adaptive` is in the command arguments, a writer may Write a no-re-ask packet at `docs/delivery/<name>/packets/<from>-to-<peer>.md` naming a registered peer, or the coordinator Writes one fallback packet FROM that writer TO the next queued specialist else tech-lead — one fallback packet per run; spawn `peer-router` when a packet exists; after it returns, persist `docs/delivery/<name>/stages/peer-router.md` and `report` it; print a handoff line `handoff: <from> → <to>` on the board; then Agent that peer with the packet as the brief; hops count against the spawn cap. Without `--adaptive`, ignore `packets/` and never spawn `peer-router`.

Run the pre-release checklist for the upcoming release `{{args}}` (or "next" if unspecified) and produce a ship / hold verdict.

## Checks (run in order; collect results without stopping on a single failure)

### 1. Code quality
```
./vendor/bin/pint --test
./vendor/bin/phpstan analyse --no-progress
php artisan test --parallel
```
Record: pass/fail, count of issues, time taken.

### 2. Migration safety
- `php artisan migrate:status` — list pending migrations
- For each pending migration: does it have a working `down()`? Is it lock-free on large tables? Backfill plan documented?
- Hand any migration without these to `database-developer`.

### 3. Queue / scheduler topology
- `config/queue.php`, `config/horizon.php` — supervisors match expected workload?
- `routes/console.php` (or `withSchedule()` in `bootstrap/app.php`; `app/Console/Kernel.php` only on legacy ≤ L10 apps) — any new scheduled tasks? Are they `withoutOverlapping()` and `onOneServer()` where they need to be?
- Are any new jobs missing `$tries`, `$backoff`, or `$timeout`? (Or their L13 attribute forms `#[Tries]`, `#[Backoff]`, `#[Timeout]`.)
- Deploy step restarts long-running services? (`php artisan reload` on L13 — workers, Reverb, Octane in one command; older: `queue:restart` / `horizon:terminate` / `octane:reload`.)

### 4. Configuration & secrets
- `.env.example` updated for every new `env()` key referenced in `config/*.php`?
- Any new `env()` calls outside `config/*.php`? (Run `grep -rn "env(" app/ routes/ resources/`.) Block on findings — these break under `config:cache`.
- `APP_DEBUG=false` in production env?
- `php artisan optimize` runs clean against the production config? (One command — caches config, events, routes, and views; chaining the four `*:cache` commands in one artisan call errors out.)

### 5. Security smoke
- `composer audit`
- `npm audit` (production deps only)
- New routes have middleware (`auth`, `throttle`, Policy `authorize()` calls)?
- Any new `{!! !!}` in Blade? Justified?
- Any new file uploads validated by MIME *and* size *and* extension?

### 6. Frontend
- `npm run build` succeeds
- Bundle size delta vs previous release?
- Any Vite warnings about Tailwind purge or missing imports?

### 7. Docs
- `CHANGELOG.md` updated?
- Any public API change without a Scribe/OpenAPI update?
- Any new env var without a README mention?

### 8. Rollback plan
- If this release fails in prod, what's the rollback path?
- Are migrations reversible? Any data-loss in rollback?
- Is the deployment platform (Forge/Vapor/Envoyer/Kamal/Kubernetes) configured for atomic rollback?

## Output

Produce `docs/qa/release-{{args}}.md` with:

```
# Release {{args}} — ship checklist

**Verdict:** SHIP / HOLD / CONDITIONAL

## Quality gates
- Pint: <status>
- PHPStan/Larastan: <status>
- Tests: <status> (<n> passed, <m> failed)

## Migrations
<table of pending migrations with risk assessment>

## Queues & scheduler
<findings>

## Configuration
<findings>

## Security
<findings; severe items linked to security-engineer review>

## Frontend
<findings>

## Docs
<findings>

## Rollback plan
<plan>

## Open items requiring human decision
- ...
```

## When to call HOLD

- Any **Blocking** finding from `security-engineer`
- Any migration without a rollback path
- Any failing test that's not explicitly documented as a known issue with workaround
- `composer audit` flags a high-severity unresolved vulnerability
- `APP_DEBUG=true` slips into the production env file
- Any new `env()` outside `config/*.php`

## When to call CONDITIONAL

- Tests pass but coverage on changed code is below the project's agreed threshold
- Bundle size grew significantly without an explained reason
- Docs drift detected but not yet addressed
'''
