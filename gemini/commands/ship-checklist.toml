description = "Run the pre-release ship checklist for a Laravel app — quality gates, migrations, queues, env, security, docs — and produce a go/no-go report.  (args: [version-tag] [--adaptive])"

prompt = '''
# Ship checklist — `{{args}}`

> **Delegation:** Spawn each specialist by its registered agent type as it appears in your available-agents list — prefixed when installed as a plugin (e.g. `laravel-team:backend-developer`), unprefixed when installed via `install.sh`. The specialist names in this command are labels, not literal `subagent_type` strings.

> **Interface:** Print a progress board after the plan and after every stage — `✔ done / ▶ running / · queued / ✖ failed` + owner + one-line result, so the user never wonders what's running or what's left. The board's header states the stage budget **before** any agent spends tokens — how many stages you expect and the observable condition that ends the run (`N stages · done when: <the observable thing>`); a board that arrives only as a closing summary told the human nothing they could still act on. Growing past that budget is a re-plan: reprint the header with the new count and why it grew. Demand each specialist return `STATUS / DID / VERIFIED / NOT-CHECKED / FLAGS / NEXT` (≤12 lines; an empty VERIFIED is a claim, a missing NOT-CHECKED is uncalibrated — either → re-brief once naming the gap). **Stage returns land on disk** — brief each specialist with `docs/delivery/<name>/stages/<agent>.md`; writers Write the six fields there as their last act; Read that file before `✔`; never write a writer's stage file for them. Read-only specialists (`disallowedTools: Write`) — persist their stage file from the report you already file, same as their other artifacts. Human decision needed → numbered options with a recommended default, never a paragraph. **Your own final answer closes the same way** — a `VERIFIED` line carrying the commands you actually ran, then `NOT-CHECKED` naming what you did not verify (≤3 lines, or "none"). **Once ≥2 specialists have reported, this delivery harvests too** — persist `docs/team/stack.md` (verified project facts + where-things-live, `delivery-templates` skill shape) from what they've reported, and maintain `docs/delivery/<name>/log.md` (phase by phase, agent by agent, artifact by artifact). Both exist before your final answer, not after. A single-specialist ask has nothing to harvest — skip both. **You do not build and you do not patch** — Write/Edit only under `docs/**`; never edit a specialist's files to "just fix it" (re-brief or escalate). **Verify before advancing** — re-run that brief's success criteria yourself; a specialist's `STATUS: done` is a claim, not a `✔`. Stage returns are internal; this is the only calibration the human ever sees, so a run that ends without it is unfinished. **Brief only what the specialist owns** — goal, owned paths, success criteria, stage path, named stack facts; not another specialist's diff. **Join before a dependent stage** — Read every upstream stage file and re-run its criteria before starting a stage that depends on it. Re-brief overwrites `docs/delivery/<name>/stages/<agent>.md`. **Close file on disk** — after the plan and after every stage, overwrite `docs/delivery/<name>/close.md` with coordinator `VERIFIED` / `NOT-CHECKED` / `STATUS` / `BOARD`. A killed run is scored from that file. **Spawn cap in the board header** — `N stages · cap: M spawns · done when:`; `M` defaults to `N+2`; hitting `M` without `done when:` → `close.md` `STATUS: stopped` and stop. When `--adaptive` is in the command arguments, a writer may Write a no-re-ask packet at `docs/delivery/<name>/packets/<from>-to-<peer>.md` naming a registered peer; spawn `peer-router` to validate it; then Agent that peer with the packet as the brief; print a handoff line on the board; hops count against the spawn cap. If no writer packet exists, the coordinator Writes one fallback packet FROM that writer TO the next queued specialist else tech-lead — one fallback packet per run. Without `--adaptive`, ignore `packets/` and never spawn `peer-router`. After the plan, first Write of `docs/delivery/<name>/graph.md` is a byte copy of skills/delivery-templates/graph.md, then Edit only after the colons; do not spawn a type that is not a NODES: entry; an Adaptive hop TO: must be a node.

Run the pre-release checklist for the upcoming release `{{args}}` (or "next" if unspecified) and produce a ship / hold verdict.

## Checks (run in order; collect results without stopping on a single failure)

### 1. Code quality
```
./vendor/bin/pint --test
./vendor/bin/phpstan analyse --no-progress
php artisan test --parallel
```
Record: pass/fail, count of issues, time taken.

### 2. Migration safety
- `php artisan migrate:status` — list pending migrations
- For each pending migration: does it have a working `down()`? Is it lock-free on large tables? Backfill plan documented?
- Hand any migration without these to `database-developer`.

### 3. Queue / scheduler topology
- `config/queue.php`, `config/horizon.php` — supervisors match expected workload?
- `routes/console.php` (or `withSchedule()` in `bootstrap/app.php`; `app/Console/Kernel.php` only on legacy ≤ L10 apps) — any new scheduled tasks? Are they `withoutOverlapping()` and `onOneServer()` where they need to be?
- Are any new jobs missing `$tries`, `$backoff`, or `$timeout`? (Or their L13 attribute forms `#[Tries]`, `#[Backoff]`, `#[Timeout]`.)
- Deploy step restarts long-running services? (`php artisan reload` on L13 — workers, Reverb, Octane in one command; older: `queue:restart` / `horizon:terminate` / `octane:reload`.)

### 4. Configuration & secrets
- `.env.example` updated for every new `env()` key referenced in `config/*.php`?
- Any new `env()` calls outside `config/*.php`? (Run `grep -rn "env(" app/ routes/ resources/`.) Block on findings — these break under `config:cache`.
- `APP_DEBUG=false` in production env?
- `php artisan optimize` runs clean against the production config? (One command — caches config, events, routes, and views; chaining the four `*:cache` commands in one artisan call errors out.)

### 5. Security smoke
- `composer audit`
- `npm audit` (production deps only)
- New routes have middleware (`auth`, `throttle`, Policy `authorize()` calls)?
- Any new `{!! !!}` in Blade? Justified?
- Any new file uploads validated by MIME *and* size *and* extension?

### 6. Frontend
- `npm run build` succeeds
- Bundle size delta vs previous release?
- Any Vite warnings about Tailwind purge or missing imports?

### 7. Docs
- `CHANGELOG.md` updated?
- Any public API change without a Scribe/OpenAPI update?
- Any new env var without a README mention?

### 8. Rollback plan
- If this release fails in prod, what's the rollback path?
- Are migrations reversible? Any data-loss in rollback?
- Is the deployment platform (Forge/Vapor/Envoyer/Kamal/Kubernetes) configured for atomic rollback?

## Output

Produce `docs/qa/release-{{args}}.md` with:

```
# Release {{args}} — ship checklist

**Verdict:** SHIP / HOLD / CONDITIONAL

## Quality gates
- Pint: <status>
- PHPStan/Larastan: <status>
- Tests: <status> (<n> passed, <m> failed)

## Migrations
<table of pending migrations with risk assessment>

## Queues & scheduler
<findings>

## Configuration
<findings>

## Security
<findings; severe items linked to security-engineer review>

## Frontend
<findings>

## Docs
<findings>

## Rollback plan
<plan>

## Open items requiring human decision
- ...
```

## When to call HOLD

- Any **Blocking** finding from `security-engineer`
- Any migration without a rollback path
- Any failing test that's not explicitly documented as a known issue with workaround
- `composer audit` flags a high-severity unresolved vulnerability
- `APP_DEBUG=true` slips into the production env file
- Any new `env()` outside `config/*.php`

## When to call CONDITIONAL

- Tests pass but coverage on changed code is below the project's agreed threshold
- Bundle size grew significantly without an explained reason
- Docs drift detected but not yet addressed
'''
