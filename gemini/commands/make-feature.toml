description = "Scaffold a full Laravel feature end-to-end — migration, model, factory, Form Request, Resource, controller/action, route, Policy, and feature test — by delegating to the right specialists.  (args: <feature-name> [--inertia|--livewire|--api|--blade|--adaptive])"

prompt = '''
# Make feature — `{{args}}`

> **Delegation:** Spawn each specialist by its registered agent type as it appears in your available-agents list — prefixed when installed as a plugin (e.g. `laravel-team:backend-developer`), unprefixed when installed via `install.sh`. The specialist names in this command are labels, not literal `subagent_type` strings.

> **Interface:** Print a progress board after the plan and after every stage — `✔ done / ▶ running / · queued / ✖ failed` + owner + one-line result, so the user never wonders what's running or what's left. The board's header states the stage budget **before** any agent spends tokens — how many stages you expect and the observable condition that ends the run (`N stages · done when: <the observable thing>`); a board that arrives only as a closing summary told the human nothing they could still act on. Growing past that budget is a re-plan: reprint the header with the new count and why it grew. Demand each specialist return `STATUS / DID / VERIFIED / NOT-CHECKED / FLAGS / NEXT` (≤12 lines; an empty VERIFIED is a claim, a missing NOT-CHECKED is uncalibrated — either → re-brief once naming the gap). **Stage returns land on disk** — brief each specialist with `docs/delivery/<name>/stages/<agent>.md`; writers Write the six fields there as their last act; Read that file before `✔`; never write a writer's stage file for them. Read-only specialists (`disallowedTools: Write`) — persist their stage file from the report you already file, same as their other artifacts. Human decision needed → numbered options with a recommended default, never a paragraph. **Your own final answer closes the same way** — a `VERIFIED` line carrying the commands you actually ran, then `NOT-CHECKED` naming what you did not verify (≤3 lines, or "none"). **Once ≥2 specialists have reported, this delivery harvests too** — persist `docs/team/stack.md` (verified project facts + where-things-live, `delivery-templates` skill shape) from what they've reported, and maintain `docs/delivery/<name>/log.md` (phase by phase, agent by agent, artifact by artifact). Both exist before your final answer, not after. A single-specialist ask has nothing to harvest — skip both. **You do not build and you do not patch** — Write/Edit only under `docs/**`; never edit a specialist's files to "just fix it" (re-brief or escalate). **Verify before advancing** — re-run that brief's success criteria yourself; a specialist's `STATUS: done` is a claim, not a `✔`. Stage returns are internal; this is the only calibration the human ever sees, so a run that ends without it is unfinished. **Brief only what the specialist owns** — goal, owned paths, success criteria, stage path, named stack facts; not another specialist's diff. **Join before a dependent stage** — Read every upstream stage file and re-run its criteria before starting a stage that depends on it. Re-brief overwrites `docs/delivery/<name>/stages/<agent>.md`. **Close file on disk** — after the plan and after every stage, overwrite `docs/delivery/<name>/close.md` with coordinator `VERIFIED` / `NOT-CHECKED` / `STATUS` / `BOARD`. A killed run is scored from that file. **Spawn cap in the board header** — `N stages · cap: M spawns · done when:`; `M` defaults to `N+2`; hitting `M` without `done when:` → `close.md` `STATUS: stopped` and stop. When `--adaptive` is in the command arguments, a writer may Write a no-re-ask packet at `docs/delivery/<name>/packets/<from>-to-<peer>.md` naming a registered peer, or the coordinator Writes one fallback packet FROM that writer TO the next queued specialist else tech-lead — one fallback packet per run; spawn `peer-router` when a packet exists; after it returns, Write `docs/delivery/<name>/stages/peer-router.md`; print a handoff line `handoff: <from> → <to>` on the board; then Agent that peer with the packet as the brief; hops count against the spawn cap. Without `--adaptive`, ignore `packets/` and never spawn `peer-router`. After the plan, first Write of `docs/delivery/<name>/graph.md` is a byte copy of skills/delivery-templates/graph.md, then Edit only after the colons; do not spawn a type that is not a NODES: entry; an Adaptive hop TO: must be a node.

Scaffold the feature described by `{{args}}` end-to-end, using the right specialist for each layer. Default to the frontend paradigm already used in the project unless explicitly overridden.

## Plan

1. **Detect the frontend paradigm.**
   - `inertiajs/inertia-laravel` in `composer.json` → Inertia
   - `livewire/livewire` → Livewire
   - Neither → Blade (or `--api` for headless)
   Override via the flag if present in `{{args}}`.

2. **Brief `business-analyst`** *only if* the feature ask is vague. Otherwise skip — this is a scaffold, not discovery.

3. **Delegate in dependency order — not one long chain.** Stage a first (everything reads its schema). Stages b and c run **in parallel** — they touch disjoint paths (backend owns `app/` + `routes/`, frontend owns `resources/`), and the migration's field list + planned route names are contract enough for the frontend to build against. Carry the paradigm detected in step 1 and the stack snapshot in **every** brief so no specialist re-reads `composer.json`/configs.

   ### a. `database-developer`
   - Design and write the migration (reversible, indexed, constraints explicit)
   - Update or create the Eloquent model (with `$fillable`, `$casts`, relations, scopes)
   - Update or create the factory

   ### b. `backend-developer`
   - Form Request (`Store<Feature>Request`, `Update<Feature>Request`) with validation rules
   - API Resource (`<Feature>Resource`, `<Feature>Collection` if list endpoint)
   - Policy with `viewAny`, `view`, `create`, `update`, `delete`
   - Controller (resourceful) or Action classes per the project's pattern
   - Route registration in `routes/web.php`, `routes/api.php`, or both
   - Wire the Policy in `AuthServiceProvider` if the project doesn't auto-discover

   ### c. `frontend-developer` (skipped for `--api`; runs in parallel with b — brief it with the field list + route names as its contract)
   - **Inertia:** page components in `resources/js/Pages/<Feature>/{Index,Show,Create,Edit}.{vue,jsx,tsx}` with `useForm`, server-driven validation errors, and shared layout
   - **Livewire:** components under `app/Livewire/<Feature>/` with computed properties, `#[Rule]` attributes, loading/error states
   - **Blade:** views under `resources/views/<feature>/` using existing component library

   ### d. `qa-engineer` (starts once b + c land)
   - Feature test covering happy path, validation failure, authorization denial, and DB state
   - Factory state used; `RefreshDatabase` per the project pattern
   - Livewire/Inertia assertion helpers as appropriate

4. **Brief `tech-lead`** for review of the implementation diff **in parallel with stage d** — review needs the b + c diff, not the tests; qa's tests are verified by running them. Run the full suite once, after both return — not after every stage.

## Guardrails

- Match the project's conventions, do not import new patterns
- If the project doesn't have `app/Actions/` and uses controllers-with-methods, follow that — don't impose Actions
- If the project uses `app/Services/`, follow that too
- Don't introduce new packages without checking `GEMINI.md` for any constraint

## Output

After all phases complete, summarise:
- Files created and their paths
- Routes added (`php artisan route:list` excerpt)
- Tests passing (`php artisan test --filter=<Feature>` output)
- Any human checkpoints surfaced
'''
