description = "Audit a route, Inertia page, or Livewire component for N+1 queries and report the fixes.  (args: <route-or-component-name> [--adaptive])"

prompt = '''
# Audit N+1 — `{{args}}`

> **Delegation:** Spawn each specialist by its registered agent type as it appears in your available-agents list — prefixed when installed as a plugin (e.g. `laravel-team:backend-developer`), unprefixed when installed via `install.sh`. The specialist names in this command are labels, not literal `subagent_type` strings.

> **Interface:** Call `python3 scripts/guild-kernel/guild.py` for this delivery — `plan` before any Agent, `ready` to fetch the bounded dependency-ready wave, `claim --stage <id>` before each Agent, then dispatch every claimed lane concurrently, and `report` on `docs/delivery/<name>/stages/<agent>.md` after each return, `board` to print `✔ done / ▶ running / · queued / ✖ failed`. `plan` must pass a nonempty `--done-when` and every typed `--stage-json` must carry success criteria and `owned_paths`; use `--max-parallel` to set the WIP ceiling. If a sprint is running, attach it (`--sprint <id>` or the kernel attaches the single running sprint). Never invent a checkmark; never compose `docs/delivery/<name>/close.md` (the kernel renders that view). Never compose `docs/sprints/<id>/sprint.md` (the kernel renders that view). `plan` prints `RULES:` only for user-approved learned rules; brief every `RULES:` line. Never compose `docs/team/lessons.md` (the kernel renders that view). When the command includes `--issue <n>`, `plan` passes `--issue <n>`. Call `pr --number <n>` once a pull request exists; the kernel re-fetches it. Call `ingest` only for a failing check or a review comment the kernel confirms. Never compose issue or pr fields. A workplace delivery stays running until the recorded PR state is open. Never merge. Writers Write the six fields `STATUS / DID / VERIFIED / NOT-CHECKED / FLAGS / NEXT` (≤12 lines) as their last act; never write a writer's stage file for them. Read-only specialists — persist their stage file from the report you already file, then `report`. `VERIFIED:` lines are JSON verification records (`{"runner":"artisan-test","args":["--filter=TagTest"]}`); the kernel accepts only registered runners and executes argv without a shell; prose and legacy command strings are rejected. `NOT-CHECKED:` that names a stage success criterion is a reject. Human decision needed → numbered options with a recommended default, never a paragraph. **Your own final answer closes the same way** — a `VERIFIED` line carrying the commands you actually ran, then `NOT-CHECKED` naming what you did not verify (≤3 lines, or "none"). **Once ≥2 specialists have reported, this delivery harvests too** — persist `docs/team/stack.md` (verified project facts + where-things-live, `delivery-templates` skill shape) from what they've reported, and maintain `docs/delivery/<name>/log.md` (phase by phase, agent by agent, artifact by artifact). Both exist before your final answer, not after. A single-specialist ask has nothing to harvest — skip both. **You do not build and you do not patch** — Write/Edit only under `docs/**`; never edit a specialist's files to "just fix it" (re-brief or escalate). When `--adaptive` is in the command arguments, a writer may Write a no-re-ask packet at `docs/delivery/<name>/packets/<from>-to-<peer>.md` naming a registered peer, or the coordinator Writes one fallback packet FROM that writer TO the next queued specialist else tech-lead — one fallback packet per run; spawn `peer-router` when a packet exists; after it returns, persist `docs/delivery/<name>/stages/peer-router.md` and `report` it; print a handoff line `handoff: <from> → <to>` on the board; then Agent that peer with the packet as the brief; hops count against the spawn cap. Without `--adaptive`, ignore `packets/` and never spawn `peer-router`.

Investigate `{{args}}` (a route name, URL path, Livewire component, or Inertia page) for N+1 query patterns and produce an actionable findings report.

## What you do

1. **Locate the entry point.**
   - If it looks like a URL path → grep `routes/` for the matching definition
   - If it's a route name → `php artisan route:list | grep '{{args}}'`
   - If it's a Livewire component → look under `app/Livewire/` (v3) or `app/Http/Livewire/` (v2)
   - If it's an Inertia page name → grep controllers for `Inertia::render('{{args}}'`

2. **Trace the data graph.** From the entry point, follow:
   - The controller / Livewire / Inertia handler
   - The Eloquent queries it triggers
   - The API Resource or Blade view it returns

3. **Spot the N+1 patterns:**
   - `->each()`, `->map()`, `foreach` over a Collection that accesses a relation without it being eager-loaded
   - API Resources or Blade views that traverse `$model->relation->...` for related fields when the parent collection didn't `->with('relation')`
   - Polymorphic `morphMany` / `morphTo` rendered in a list — these need `morphWith` to be efficient
   - `count()` on relations inside loops — use `withCount`
   - Existence checks inside loops — use `withExists`
   - Nested relations rendered without nested eager loads (`with('relation.subRelation')`)

4. **Run the route under the query log if reachable.** Either:
   - Telescope Queries tab if installed
   - Or wrap a manual reproduction with:
     ```php
     \DB::enableQueryLog();
     // hit the route / call the component
     dd(\DB::getQueryLog());
     ```
   - Or run the relevant feature test with `\DB::listen(...)` enabled

5. **Produce the findings report:**

   ```
   # N+1 audit — {{args}}

   ## Summary
   - Queries observed: <n>
   - N+1 sites found: <n>

   ## Findings

   ### Finding 1 — <file>:<line>
   - Pattern: <pattern>
   - Trigger: <what causes the loop>
   - Fix: <eager-load syntax or pattern change>
   - Estimated query reduction: from <n> to <m>

   ## Recommended diff (paraphrased — do not apply, hand to backend-developer)
   ```php
   // Before
   $users = User::all();
   // After
   $users = User::with(['posts', 'comments'])->get();
   ```

6. **Do not apply the fixes yourself.** Hand the report to `backend-developer` (or `frontend-developer` if the offending access is in a Livewire/Inertia component).
'''
